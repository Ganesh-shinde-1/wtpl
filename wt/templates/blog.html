                        <div class="logo">

                        </div>
                        <!-- End Logo -->
                        <!-- Mobile Nav -->
                        <div class="mobile-nav"></div>
                        <!-- End Mobile Nav -->
                    </div>
                    <div class="col-lg-7 col-md-9 col-12">
                        <!-- Main Menu -->
                        <div class="main-menu">
                            <nav class="navigation">
                                <ul class="nav menu">

                                        </ul>
                                    </li> -->

                                </ul>
                            </nav>

		<div class="breadcrumbs overlay" style="margin-bottom: 0%;">

				<div class="bread-inner">

						<div class="col-12">
							<h1 style="color: white;">Blogs</h1>
					</div>
                    </div>
				</div>
			</div>
		</div>

		<section class="portfolio section"  style="margin-bottom: 0%; padding-top: 2%;">
			<div class="container-fluid">
               
				<div class="row">
					<div class="col-lg-12 col-12">
						<div class="owl-carousel portfolio-slider">
							

                            {%if blogs%}
                            
                            {%for item in blogs%}
                            <div class="single-pf">
								<img src="{{item.image.url}}" alt="#">

							</div>

							{%endif%}
                            
                            
                            
						</div>
					</div>
				</div>
			</div>
