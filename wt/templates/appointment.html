{%block 'content'%}

			<div class="container">
				<div class="inner">
					<div class="row">
						<div class="col-lg-3 col-md-3 col-12">
							<!-- Start Logo -->
							<div class="logo">
								{%load static%}
								<a href="{%url 'home'%}"><img src="{%static 'img/logo.png'%}" alt="#"></a>
							</div>
							<!-- End Logo -->
							<!-- Mobile Nav -->
							<div class="mobile-nav"></div>
							<!-- End Mobile Nav -->
						</div>
						<div class="col-lg-7 col-md-9 col-12">
							<!-- Main Menu -->
							<div class="main-menu">
								<nav class="navigation">
									<ul class="nav menu">
										<!-- <li class="active"><a href="#">Home <i class="icofont-rounded-down"></i></a>
											<ul class="dropdown">
												<li><a href="index.html">Home Page 1</a></li>
											</ul>
										</li> -->
										<!-- <li><a href="#">Doctos </a></li> -->
										<li ><a href="{%url 'home'%}">Home </a></li>
										<li><a href="{%url 'services'%}">Services</a></li>

										<li><a href="{%url 'contactus'%}">Contact us</a></li>
										<li><a href="{% url 'blog'%}">Blog</a></li>
									</ul>
								</nav>
							</div>
							<!--/ End Main Menu -->
						</div>
						<div class="col-lg-2 col-12">
							<div class="get-quote" >
								<a style="text-decoration: underline;" href="{%url 'WorkWithUS'%}" class="btn">Work with Us.</a>
							</div>

					</div>
				</div>
			</div>
		</div>
		<!--/ End Header Inner -->
	</header>
	<!-- End Header Area -->
		
				
		<!-- Start Contact Us -->
		<section class="contact-us section">
			<div class="container">
				<div class="inner">
					<div class="row"> 
						<div class="col-lg-6">
							<div class="contact-us-left" >
								<!--Start Google-map -->
								{%load static%}
								<img src="{% static 'img/inquairy.jpg'%}" alt="" id="Workwithus">


								<!-- <img src="{%static 'img/blog1.jpg'%}" alt=""> -->
								<!-- <iframe src="{{d1}}" frameborder="0"   class="contact-us-left"  ></iframe> -->
								
								<!--/End Google-map -->
							</div>
						</div>
						<div class="col-lg-6">
							<div class="contact-us-form">
								<h2>work with us</h2>
								<p>fill the form to connect wth us.</p>
								<!-- Form -->
								<form class="form" method="post" action="{%url 'WorkWithUS'%}">
									{%csrf_token%}
									<div class="row">
										<div class="col-lg-6">
											<div class="form-group">
												<input type="text" name="name" placeholder="Name" required="">
											</div>
										</div>
										<div class="col-lg-6">
											<div class="form-group">
												<input type="email" name="email" placeholder="Email" required="">
											</div>
										</div>
										<div class="col-lg-6">
											<div class="form-group">
												<input type="text" name="phone" placeholder="Phone" required="">
											</div>
										</div>
										<div class="col-lg-6">
											<div class="form-group">
												<input type="text" name="subject" placeholder="Subject" required="">
											</div>
										</div>
										<div class="col-lg-12">
											<div class="form-group">
												<textarea name="message" placeholder="Your Message" required=""></textarea>
											</div>
										</div>
										<div class="col-12">
											<div class="form-group login-btn">
												<button class="btn" type="submit">Send</button>
											</div>
											
										</div>
									</div>
								</form>
								<!--/ End Form -->
							</div>
						</div>
					</div>
				</div>
				
			</div>
		</section>
		<!--/ End Contact Us -->
		
				{%endblock%}
