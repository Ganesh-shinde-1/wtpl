{%extends 'base.html'%}


{%block 'content'%}
<!-- Header Area -->
<header class="header" >
	<!-- Header Inner -->
	<div class="header-inner">
		<div class="container">
			<div class="inner">
				<div class="row">
					<div class="col-lg-3 col-md-3 col-12">
						<!-- Start Logo -->
						<div class="logo">
							{%load static%}
							<a href="{%url 'home'%}"><img src="{%static 'img/logo.png'%}" alt="#"></a>
						</div>
						<!-- End Logo -->
						<!-- Mobile Nav -->
						<div class="mobile-nav"></div>
						<!-- End Mobile Nav -->
					</div>
					<div class="col-lg-7 col-md-9 col-12">
						<!-- Main Menu -->
						<div class="main-menu">
							<nav class="navigation">
								<ul class="nav menu">
									<!-- <li class="active"><a href="#">Home <i class="icofont-rounded-down"></i></a>
										<ul class="dropdown">
											<li><a href="index.html">Home Page 1</a></li>
										</ul>
									</li> -->
									<!-- <li><a href="#">Doctos </a></li> -->
									<li ><a href="{%url 'home'%}">Home </a></li>
									<li><a href="{%url 'services'%}">Services</a></li>
									<li class="active"><a href="{% url 'aboutUs'%}">About us</a></li>
									<li><a href="{%url 'contactus'%}">Contact us</a></li>
									<li><a href="{% url 'blog'%}">Blog</a></li>
								</ul>
							</nav>
						</div>
						<!--/ End Main Menu -->
					</div>
					<div class="col-lg-2 col-12">
						<div class="get-quote">
							<a href="{%url 'WorkWithUS'%}" class="btn">Work with Us.</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!--/ End Header Inner -->
</header>
<!-- End Header Area -->

		
		<!-- Breadcrumbs -->
		<div class="breadcrumbs overlay">
			<div class="container">
				<div class="bread-inner">
					<div class="row">
						<div class="col-12">
							<h2>About us</h2>
							<ul class="bread-list">
								<li><a href="{%url 'home'%}">Home</a></li>
								<li><i class="icofont-simple-right"></i></li>
								<li class="active">About us</li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- End Breadcrumbs -->
		


		<!-- Single News -->
		<section class="news-single section">
			<div class="container">
				<!-- <div class="row"> -->
					<!-- <div class="col-lg-8 col-12"> -->

						{%for item in aboutus%}
						<div class="row">
							<div class="col-12">
								<div class="single-main">
									<!-- News Head -->
									<div class="news-head">
										<img src="{{item.image.url}}" alt="#">
									</div>
									<!-- News Title -->
									<h1 class="news-title" style="font-size: 400%;">{{item.title}}</h1>
									<!-- Meta -->
								
									<!-- News Text -->
									<div class="news-text">
										<p style="font-size: 100%;">
											{{item.content}}
										</p>
									</div>
									
								</div>
							</div>
							{%endfor%}

							
						</div>
				</div>
		</section>
		<!--/ End Single News -->
		
{%endblock%}
